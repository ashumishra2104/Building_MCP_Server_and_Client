<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Resume — {{FULL_NAME}}</title>

<!--
  ─────────────────────────────────────────────────────────────────────
  ATS-SAFE RESUME TEMPLATE — RULES FOR THE AGENT FILLING THIS TEMPLATE
  ─────────────────────────────────────────────────────────────────────
  This template exists to survive both (a) an ATS parser extracting
  structured fields, and (b) a human recruiter skimming for ~7 seconds.
  When generating {{EXPERIENCE_HTML}}, {{EDUCATION_HTML}}, and
  {{CORE_COMPETENCIES_HTML}}, follow these rules exactly:

  1. SINGLE COLUMN ONLY. Never introduce CSS Grid, multi-column layout,
     floats, or absolute positioning for structural content. Flexbox
     "space-between" (as used in .role-header below) is fine because it
     doesn't change DOM order — the underlying text order stays
     title-then-date even though it renders spread apart.

  2. NO ICONS, EMOJI, PHOTOS, OR BADGES. Plain text only. Icons and
     emoji are a real parsing risk in some ATS/PDF pipelines and add
     zero keyword value.

  3. NO TABLES FOR LAYOUT. Tables are only acceptable for genuinely
     tabular data (there is none in a resume) — never for positioning.

  4. ONE BOLD LABEL PER BULLET, not scattered bold mid-sentence.
     Pattern: <b>Label:</b> rest of the achievement in plain text.
     This matches the docx/PDF version of this resume and keeps
     visual scanning consistent across all generated formats.

  5. JD-TAILORING TARGETS, in priority order:
     a. {{PROFESSIONAL_SUMMARY}} — rewrite to mirror the JD's own
        language for role scope and domain, WITHOUT inventing
        experience. Only rephrase, never fabricate.
     b. {{CORE_COMPETENCIES_HTML}} — reorder/select from the
        candidate's real skill set to surface what the JD asks for
        first. Do not add a skill the candidate has never used.
     c. Bullet selection/order within {{EXPERIENCE_HTML}} — within
        each role, the existing bullets may be reordered to put the
        most JD-relevant achievement first. Bullet TEXT should only
        be lightly reworded for vocabulary match (e.g. "adoption" →
        "engagement and adoption") — never invent new metrics.
     d. {{TARGET_TITLE}} — may echo the JD's exact title wording if
        it's an honest match to the candidate's actual scope; never
        claim a title the candidate didn't hold.

  6. NEVER FABRICATE: metrics, team sizes, tools, or outcomes not
     present in the candidate's source data. Tailoring means
     re-emphasis and re-wording, not invention. A lower JD-match score
     with all-true content beats a higher score with anything invented.

  7. Keep total content to ~2 pages worth (roughly 1000-1200 words in
     Professional Experience + Summary combined) for an 8+ year
     candidate. Trim lowest-relevance bullets first if a role is
     getting too dense, don't shrink font/margins to force a fit.

  ─────────────────────────────────────────────────────────────────────
  REQUIRED SUB-STRUCTURE FOR {{EXPERIENCE_HTML}} — repeat this block
  once per role, in reverse-chronological order:

    <div class="role-header">
      <span class="role-title">{{Title}} — {{Company}}</span>
      <span class="role-dates">{{StartDate}} — {{EndDate}}</span>
    </div>
    <div class="company-desc">{{One-line company description}}</div>
    <div class="team-line">Team: {{N}} direct reports | Cross-functional: {{...}}</div>
    <div class="company-desc">{{One-line role/charter description}}</div>
    <ul class="bullets">
      <li><b>{{Bullet Label}}:</b> {{Bullet detail sentence(s)}}</li>
      ... (repeat per bullet, 4-6 bullets typical for a primary role)
    </ul>

  The .team-line div is OPTIONAL — omit it entirely for roles where the
  candidate has no direct reports to state (e.g. early-career roles),
  rather than leaving it blank.

  ─────────────────────────────────────────────────────────────────────
  REQUIRED SUB-STRUCTURE FOR {{EDUCATION_HTML}}:

    <div class="edu-line">{{Degree}} — {{Institution}} | {{Year}}</div>
    ... (repeat per degree)

  ─────────────────────────────────────────────────────────────────────
  REQUIRED SUB-STRUCTURE FOR {{CORE_COMPETENCIES_HTML}}:

    <div class="skills-category">{{Category Name}}</div>
    <div class="skills-line">{{Skill 1}} | {{Skill 2}} | {{Skill 3}} ...</div>
    ... (repeat per category — typical categories: Technical Skills,
         Product Management, Business Expertise. Reorder categories
         and skills within them based on JD relevance.)
  ─────────────────────────────────────────────────────────────────────
-->

<style>

@page {
  size: Letter;
  margin: 0.55in 0.65in;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy: #1F3864;
  --grey: #444444;
  --rule: #1F3864;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10.5pt;
  line-height: 1.42;
  color: #1a1a1a;
}

/* ─── HEADER ─────────────────────────────────────────────── */
.name {
  font-size: 20pt;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 0.5px;
}

.title {
  font-size: 11pt;
  font-weight: 700;
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.contact {
  font-size: 9pt;
  color: var(--grey);
  margin-top: 6px;
  line-height: 1.5;
}

.contact a {
  color: var(--navy);
  text-decoration: none;
}

hr.rule {
  border: none;
  border-top: 2px solid var(--rule);
  margin: 10px 0 4px;
}

/* ─── SECTION HEADINGS ───────────────────────────────────── */
h2.section {
  font-size: 11.5pt;
  font-weight: 700;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 2px;
  margin: 14px 0 6px;
}

/* ─── SUMMARY ────────────────────────────────────────────── */
p.summary {
  text-align: left;
  margin-bottom: 4px;
}

/* ─── EXPERIENCE ─────────────────────────────────────────── */
.role-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 10px;
  flex-wrap: wrap;
}

.role-title {
  font-weight: 700;
  font-size: 10.5pt;
}

.role-dates {
  font-weight: 700;
  font-size: 9.5pt;
  white-space: nowrap;
}

.company-desc {
  font-style: italic;
  color: var(--grey);
  font-size: 9.5pt;
  margin: 2px 0;
}

.team-line {
  font-weight: 700;
  color: var(--navy);
  font-size: 9.5pt;
  margin: 2px 0 4px;
}

ul.bullets {
  margin: 4px 0 8px 18px;
}

ul.bullets li {
  margin-bottom: 6px;
  text-align: left;
}

/* ─── EDUCATION / SKILLS ─────────────────────────────────── */
.edu-line {
  margin-bottom: 3px;
  font-size: 10pt;
}

.skills-category {
  font-weight: 700;
  font-size: 10pt;
  margin-top: 6px;
}

.skills-line {
  font-size: 9.5pt;
  margin-bottom: 2px;
}

</style>
</head>
<body>

<!-- ─────────── HEADER ─────────── -->
<div class="name">{{FULL_NAME}}</div>
<div class="title">{{TARGET_TITLE}}</div>
<div class="contact">
  {{PHONE}} &nbsp;|&nbsp; {{EMAIL}} &nbsp;|&nbsp; <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a><br/>
  {{PORTFOLIO_ROW}}{{LOCATION}}
</div>
<hr class="rule"/>

<!-- ─────────── SUMMARY ─────────── -->
<h2 class="section">Professional Summary</h2>
<p class="summary">{{PROFESSIONAL_SUMMARY}}</p>

<!-- ─────────── EXPERIENCE ─────────── -->
<h2 class="section">Professional Experience</h2>
{{EXPERIENCE_HTML}}

<!-- ─────────── EDUCATION ─────────── -->
<h2 class="section">Education</h2>
{{EDUCATION_HTML}}

<!-- ─────────── CORE COMPETENCIES ─────────── -->
<h2 class="section">Core Competencies</h2>
{{CORE_COMPETENCIES_HTML}}

</body>
</html>
